<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=public/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico">
  <title>PubScreen - Redirection...</title>
  <script>
    window.location.replace("public/" + window.location.search);
  </script>
</head>
<body style="background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Chargement de l'écran dynamique... <a id="fallback-link" href="public/index.html" style="color: #3b82f6;">Cliquez ici si la redirection ne démarre pas.</a></p>
  <script>
    if (window.location.search) {
      const fl = document.getElementById('fallback-link');
      if (fl) fl.href = "public/index.html" + window.location.search;
    }
  </script>
</body>
</html>
