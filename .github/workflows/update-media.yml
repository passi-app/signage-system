name: Update Media Index (Headless CMS)

on:
  push:
    branches:
      - main
    paths:
      - 'videos/**'
      - 'sponsors/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    name: Scan & Generate media-list.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scan media directories and compile index
        run: node scripts/update-media.js

      - name: Commit and push media list & public assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ media-list.json

          if ! git diff --cached --quiet; then
            git commit -m "chore(cms): auto-update media-list.json and sync public assets"
            git push
          else
            echo "No changes detected. Nothing to commit."
          fi
