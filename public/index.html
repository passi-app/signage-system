<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PubScreen - Affichage Dynamique</title>
  <meta name="description" content="Système d'affichage dynamique numérique autonome et résilient pour centre commercial.">
  <meta name="theme-color" content="#ffffff">

  <!-- Google Fonts: Plus Jakarta Sans for ultra-clean modern signage typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css?v=14">
  <script>
    if (window.location.pathname.endsWith('/public')) {
      window.location.replace(window.location.pathname + '/' + window.location.search);
    }
  </script>
</head>
<body class="signage-body">

  <!-- ========================================================
       1. BACKGROUND VIDEO LAYER (Full screen, dual crossfade)
       ======================================================== -->
  <div class="video-container" id="video-container" aria-hidden="true">
    <video
      id="bg-video-a"
      class="bg-video is-active"
      autoplay
      muted
      playsinline
      preload="auto">
    </video>
    <video
      id="bg-video-b"
      class="bg-video"
      autoplay
      muted
      playsinline
      preload="auto">
    </video>
    <div class="video-vignette"></div>
  </div>

  <!-- Fallback visual if no video is loaded yet -->
  <div class="video-fallback" id="video-fallback">
    <div class="fallback-ambient-glow"></div>
  </div>

  <!-- ========================================================
       2. PERMANENT LOGOS (Top Corners)
       ======================================================== -->
  <header class="permanent-header" role="banner">
    <!-- Passi Logo: Top Left -->
    <div class="logo-wrapper logo-left" id="logo-passi-container">
      <img
        src="logos/passi-logo.png?v=6"
        alt="Logo Passi"
        class="permanent-logo"
        id="logo-passi"
        loading="eager"
        onerror="if(!this.getAttribute('data-err')){this.setAttribute('data-err','1');this.src='../logos/passi-logo.png?v=6';}">
    </div>

    <!-- Live mall clock / status indicator & audio toggle -->
    <div class="header-center-info" id="mall-clock-container">
      <span class="live-clock" id="live-clock">--:--</span>
      <span class="live-date" id="live-date">--</span>
      <button class="audio-pill-btn" id="audio-toggle" type="button" aria-label="Contrôle audio" title="Cliquer pour activer/couper le son">
        <span class="audio-pill-icon" id="audio-icon">🔇</span>
        <span class="audio-pill-label" id="audio-label">Son coupé</span>
      </button>
    </div>

    <!-- L'agora Logo: Top Right -->
    <div class="logo-wrapper logo-right" id="logo-lagora-container">
      <img
        src="logos/lagora-logo.png?v=2"
        alt="Logo L'agora"
        class="permanent-logo"
        id="logo-lagora"
        loading="eager"
        onerror="if(!this.getAttribute('data-err')){this.setAttribute('data-err','1');this.src='../logos/lagora-logo.png?v=2';}">
    </div>
  </header>

  <!-- ========================================================
       3. SPONSOR BAR (Fixed bottom bar, full-width marquee)
       ======================================================== -->
  <footer class="sponsor-bar" role="contentinfo" id="sponsor-bar">
    <!-- Continuous Full-Width Sponsor Marquee Track across entire bar -->
    <div class="sponsor-marquee-container" id="sponsor-marquee-container">
      <div class="sponsor-marquee-track" id="sponsor-marquee-track">
        <!-- Dynamically populated by app.js -->
      </div>
    </div>

    <!-- Center: Prominent Real QR Code (Static display for smartphone cameras, not a button) -->
    <div class="qr-center-container">
      <div class="qr-card" role="img" aria-label="QR Code vers les liens officiels">
        <div class="qr-frame">
          <img
            src="logos/qr-code.png?v=6"
            alt="QR Code Passi"
            class="qr-image"
            id="qr-image"
            loading="eager"
            onerror="if(!this.getAttribute('data-err')){this.setAttribute('data-err','1');this.src='../logos/qr-code.png?v=6';}">
        </div>
      </div>
    </div>
  </footer>

  <!-- ========================================================
       4. OFFLINE & STATUS NOTIFICATIONS (Discreet)
       ======================================================== -->
  <div class="network-status-toast" id="network-status" aria-live="polite">
    <span class="status-indicator"></span>
    <span id="status-text">Mode en ligne</span>
  </div>

  <!-- Scripts -->
  <script src="app.js?v=14"></script>
</body>
</html>
