<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Passi - Liens Officiels</title>
  <meta name="description" content="Découvrez l'univers Passi à L'Agora. Suivez-nous sur Instagram et explorez notre site web officiel.">
  <meta name="theme-color" content="#111827">

  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="shortcut icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1e38 0%, #0d0f17 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --insta-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --web-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background blur elements */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.15);
      filter: blur(80px);
      top: 10%;
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow-bottom {
      top: auto;
      bottom: 10%;
      background: rgba(59, 130, 246, 0.12);
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: rgba(18, 22, 34, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 1px 0 rgba(255, 255, 255, 0.1) inset;
    }

    /* Logo badge */
    .logo-container {
      width: 154px;
      height: 110px;
      background: #ffffff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo-container:hover {
      transform: scale(1.04);
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 32px;
      max-width: 300px;
    }

    /* Links / Buttons */
    .links-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-link {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      width: 100%;
      padding: 18px 22px;
      border-radius: 18px;
      text-decoration: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .btn-link:active {
      transform: scale(0.98);
    }

    /* Instagram button */
    .btn-instagram {
      background: var(--insta-gradient);
    }

    .btn-instagram:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(220, 39, 67, 0.35);
    }

    /* Website button */
    .btn-website {
      background: var(--web-gradient);
    }

    .btn-website:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
    }

    .btn-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
    }

    .btn-text {
      flex: 1;
      text-align: left;
    }

    .btn-arrow {
      opacity: 0.7;
      transition: transform 0.2s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
    }

    .btn-link:hover .btn-arrow {
      opacity: 1;
      transform: translateX(3px);
    }

  </style>
</head>
<body>

  <div class="ambient-glow"></div>
  <div class="ambient-glow ambient-glow-bottom"></div>

  <main class="container">
    <!-- Passi Logo -->
    <div class="logo-container">
      <img
        src="../logos/passi-logo.png?v=5"
        alt="Logo Passi">
    </div>

    <h1 class="title">Passi</h1>

    <p class="subtitle">Bienvenue sur notre portail digital. Découvrez nos nouveautés, promotions et événements en direct.</p>

    <div class="links-group">
      <!-- Button 1: Instagram -->
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="btn-link btn-instagram">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </div>
        <span class="btn-text">Follow us on Instagram</span>
        <div class="btn-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <!-- Button 2: Official Website -->
      <a href="https://example.com" target="_blank" rel="noopener noreferrer" class="btn-link btn-website">
        <div class="btn-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </div>
        <span class="btn-text">Visit Official Website</span>
        <div class="btn-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>
    </div>

  </main>

</body>
</html>
